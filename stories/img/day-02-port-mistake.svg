<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="52" font-size="32" font-weight="bold" fill="#18181b" text-anchor="middle">Right devices, wrong ports</text>
  <text x="800" y="86" font-size="19" fill="#52525b" text-anchor="middle">Same 4 spine-leaf cables. Only the port numbers differ. (Host cables were already correct and aren't shown.)</text>

  <!-- ============ LEFT PANEL: your version ============ -->
  <rect x="30" y="110" width="760" height="560" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="410" y="152" font-size="24" font-weight="bold" fill="#b91c1c" text-anchor="middle">✗  Your version</text>

  <g stroke-width="4" fill="none">
    <line x1="245" y1="300" x2="245" y2="500" stroke="#334155"/>
    <line x1="605" y1="300" x2="605" y2="500" stroke="#dc2626" stroke-dasharray="12 8"/>
    <line x1="355" y1="300" x2="715" y2="500" stroke="#dc2626" stroke-dasharray="12 8"/>
    <line x1="715" y1="300" x2="355" y2="500" stroke="#dc2626" stroke-dasharray="12 8"/>
  </g>

  <g>
    <rect x="190" y="210" width="220" height="90" rx="12" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text x="300" y="262" font-size="26" font-weight="bold" fill="#4338ca" text-anchor="middle">spine1</text>
    <rect x="550" y="210" width="220" height="90" rx="12" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text x="660" y="262" font-size="26" font-weight="bold" fill="#4338ca" text-anchor="middle">spine2</text>
    <rect x="190" y="500" width="220" height="90" rx="12" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <text x="300" y="562" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="middle">leaf1</text>
    <rect x="550" y="500" width="220" height="90" rx="12" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <text x="660" y="562" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="middle">leaf2</text>
  </g>

  <!-- left port tags: green = right, red = wrong -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <!-- spine1 eth1 ok, spine1 eth2 ok -->
    <rect x="215" y="286" width="60" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="245" y="306" fill="#166534">eth1</text>
    <rect x="325" y="286" width="60" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="355" y="306" fill="#166534">eth2</text>
    <!-- spine2 eth1 WRONG (goes to leaf2), eth2 WRONG (goes to leaf1) -->
    <rect x="575" y="286" width="60" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="605" y="306" fill="#991b1b">eth1</text>
    <rect x="685" y="286" width="60" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="715" y="306" fill="#991b1b">eth2</text>
    <!-- leaf1 eth1 ok, leaf1 eth2 ok (to spine2) -->
    <rect x="215" y="486" width="60" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="245" y="506" fill="#166534">eth1</text>
    <rect x="325" y="486" width="60" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="355" y="506" fill="#166534">eth2</text>
    <!-- leaf2 eth1 WRONG (goes to spine2), eth2 WRONG (goes to spine1) -->
    <rect x="575" y="486" width="60" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="605" y="506" fill="#991b1b">eth1</text>
    <rect x="685" y="486" width="60" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/><text x="715" y="506" fill="#991b1b">eth2</text>
  </g>

  <g font-size="18" fill="#7f1d1d">
    <text x="60" y="630">4 ports in the wrong place: spine2:eth1, spine2:eth2,</text>
    <text x="60" y="656">leaf2:eth1, leaf2:eth2. Each one goes to the other device.</text>
  </g>

  <!-- ============ RIGHT PANEL: fixed ============ -->
  <rect x="810" y="110" width="760" height="560" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="1190" y="152" font-size="24" font-weight="bold" fill="#15803d" text-anchor="middle">✓  Fixed</text>

  <g stroke-width="4" fill="none" stroke="#334155">
    <line x1="1025" y1="300" x2="1025" y2="500"/>
    <line x1="1135" y1="300" x2="1385" y2="500"/>
    <line x1="1385" y1="300" x2="1135" y2="500"/>
    <line x1="1495" y1="300" x2="1495" y2="500"/>
  </g>

  <g>
    <rect x="970" y="210" width="220" height="90" rx="12" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text x="1080" y="262" font-size="26" font-weight="bold" fill="#4338ca" text-anchor="middle">spine1</text>
    <rect x="1330" y="210" width="220" height="90" rx="12" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text x="1440" y="262" font-size="26" font-weight="bold" fill="#4338ca" text-anchor="middle">spine2</text>
    <rect x="970" y="500" width="220" height="90" rx="12" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <text x="1080" y="562" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="middle">leaf1</text>
    <rect x="1330" y="500" width="220" height="90" rx="12" fill="#fff" stroke="#0284c7" stroke-width="3"/>
    <text x="1440" y="562" font-size="26" font-weight="bold" fill="#0369a1" text-anchor="middle">leaf2</text>
  </g>

  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#166534">
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
      <rect x="995" y="286" width="60" height="28" rx="7"/><rect x="1105" y="286" width="60" height="28" rx="7"/>
      <rect x="1355" y="286" width="60" height="28" rx="7"/><rect x="1465" y="286" width="60" height="28" rx="7"/>
      <rect x="995" y="486" width="60" height="28" rx="7"/><rect x="1105" y="486" width="60" height="28" rx="7"/>
      <rect x="1355" y="486" width="60" height="28" rx="7"/><rect x="1465" y="486" width="60" height="28" rx="7"/>
    </g>
    <text x="1025" y="306">eth1</text><text x="1135" y="306">eth2</text>
    <text x="1385" y="306">eth1</text><text x="1495" y="306">eth2</text>
    <text x="1025" y="506">eth1</text><text x="1135" y="506">eth2</text>
    <text x="1385" y="506">eth1</text><text x="1495" y="506">eth2</text>
  </g>

  <g font-size="18" fill="#14532d">
    <text x="840" y="630">Every port number = the number of the device</text>
    <text x="840" y="656">on the other end. Predictable, so mistakes stand out.</text>
  </g>

  <!-- ============ BOTTOM: rule + why it matters ============ -->
  <rect x="30" y="700" width="760" height="170" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="60" y="742" font-size="22" font-weight="bold" fill="#92400e">The rule</text>
  <text x="60" y="796" font-size="34" font-weight="bold" fill="#78350f" font-family="Menlo, monospace">spineX:ethY ↔ leafY:ethX</text>
  <text x="60" y="842" font-size="18" fill="#92400e">e.g. spine2 ↔ leaf1  =  spine2:eth1 ↔ leaf1:eth2</text>

  <rect x="810" y="700" width="760" height="170" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="840" y="742" font-size="22" font-weight="bold" fill="#0f172a">Why fabric-audit cares</text>
  <text x="840" y="784" font-size="19" fill="#334155">Key = device only →  "all good"     <tspan font-weight="bold" fill="#b91c1c">missed</tspan></text>
  <text x="840" y="818" font-size="19" fill="#334155">Key = (device, port), from Day 1 →  "wrong port"  <tspan font-weight="bold" fill="#15803d">caught</tspan></text>
  <text x="840" y="852" font-size="17" fill="#64748b">The network still works, so nothing else complains.</text>
</svg>
