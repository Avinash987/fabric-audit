[project]
name = "fabric-audit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lalith Avinash D", email = "lalithd1@umbc.edu" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
fabric-audit = "fabric_audit:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
